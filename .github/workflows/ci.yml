name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported floor (requires-python >=3.12) and the next declared minor.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the exact PR head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, development and service extras)
        run: python -m pip install -e '.[dev,service]'
      - name: Version agreement (source, pyproject, changelog, metadata, health)
        run: python scripts/check_version.py
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Static typing (strict)
        run: mypy
      - name: Tests with branch coverage (includes static-conformance fixtures)
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=json:coverage.json
      - name: Coverage floors
        run: python scripts/check_coverage.py coverage.json
      - name: Build and verify the distribution outside the source tree
        run: python scripts/verify_distribution.py
