[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slimx-agent"
# One maintained source: slimx_agent/__init__.py::__version__ (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "SlimX-Agent: portable agent contracts, policies, typed execution engine, planning primitives, and an optional standalone service for the SlimX platform."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SlimX AI" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
# The lint and type checkers are pinned exactly so the CI gate is deterministic: their default
# rule sets and inference change between releases. Bump them deliberately, in their own change.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "build>=1.2",
    "httpx>=0.27",
    "fastapi>=0.111",
]

[project.urls]
Repository = "https://github.com/slimx-ai/SlimX-Agent"

[tool.setuptools.dynamic]
version = { attr = "slimx_agent.__version__" }

[tool.setuptools.packages.find]
include = ["slimx_agent*"]

[tool.setuptools.package-data]
slimx_agent = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["slimx_agent", "scripts"]

[tool.coverage.run]
branch = true
source = ["slimx_agent"]
